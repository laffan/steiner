<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steiner — Dropbox Authorization</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .card {
      text-align: center;
      padding: 40px;
      border-radius: 12px;
      background: #16213e;
      max-width: 400px;
    }
    h1 { font-size: 1.4em; margin: 0 0 12px; }
    p { opacity: 0.7; margin: 0; line-height: 1.5; }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Connecting to Dropbox…</h1>
    <p id="message">Please wait while we complete the authorization.</p>
  </div>
  <script>
    // HTTPS bridge to the steiner:// custom scheme. Dropbox redirects the
    // user's browser here after they approve the app; we then JS-navigate
    // to the custom scheme so the OS can hand off to the running app.
    //
    // Why the bridge: a server-side 302 redirect from Dropbox straight to a
    // steiner:// URL is silently blocked by Chrome on Android. A
    // JavaScript-initiated navigation following a user gesture (the
    // "Allow" click) is honoured and surfaces the standard "open in app"
    // prompt across iOS Safari, Android Chrome, and desktop browsers.
    var params = new URLSearchParams(window.location.search);
    var code = params.get("code");
    var state = params.get("state");
    var error = params.get("error");
    var titleEl = document.getElementById("title");
    var msgEl = document.getElementById("message");

    function buildCallbackUrl() {
      var qs = new URLSearchParams();
      if (code) qs.set("code", code);
      if (state) qs.set("state", state);
      if (error) qs.set("error", error);
      return "steiner://auth/callback?" + qs.toString();
    }

    if (error) {
      titleEl.textContent = "Authorization Failed";
      msgEl.textContent = error === "access_denied"
        ? "You declined the Dropbox authorization. You can close this window."
        : "Error: " + error + ". You can close this window.";
      msgEl.classList.add("error");
    } else if (code) {
      titleEl.textContent = "Connected!";
      msgEl.textContent = "Returning to Steiner…";
      window.location.href = buildCallbackUrl();
      // If the scheme handler isn't registered (or the user dismisses the
      // prompt), surface a fallback so they don't sit on a spinner.
      setTimeout(function () {
        msgEl.textContent = "You can close this window and return to Steiner.";
      }, 2000);
    } else {
      titleEl.textContent = "No Authorization Code";
      msgEl.textContent = "Something went wrong. Please try again from Steiner settings.";
      msgEl.classList.add("error");
    }
  </script>
</body>
</html>
